# Development stack — hot reload for both apps.
#   docker compose up --build
# Frontend http://localhost:3000 · API http://localhost:5000/swagger · Postgres localhost:5432
name: nobat

services:
  postgres:
    image: postgres:17-alpine
    container_name: nobat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nobat}
      POSTGRES_USER: ${POSTGRES_USER:-nobat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nobat_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nobat} -d ${POSTGRES_DB:-nobat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nobat-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nobat};Username=${POSTGRES_USER:-nobat};Password=${POSTGRES_PASSWORD:-nobat_dev_password}"
      Jwt__Secret: "${JWT_SECRET:-super-secret-dev-key-change-in-production-min-32-characters-long}"
      Jwt__Issuer: "${JWT_ISSUER:-nobat}"
      Jwt__Audience: "${JWT_AUDIENCE:-nobat}"
      Cors__AllowedOrigins__0: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      BusinessTimezone: "${BUSINESS_TIMEZONE:-Asia/Tehran}"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      # Source mount enables `dotnet watch` hot reload.
      - ./backend/src:/src/src
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nobat-frontend
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: "${PUBLIC_API_BASE:-http://localhost:5000}"
      NUXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Bind the source but keep container-owned node_modules / .nuxt.
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-nuxt:/app/.nuxt
    restart: unless-stopped

volumes:
  postgres-data:
  frontend-node-modules:
  frontend-nuxt:

version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: nobat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nobat}
      POSTGRES_USER: ${POSTGRES_USER:-nobat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nobat_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nobat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nobat-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nobat};Username=${POSTGRES_USER:-nobat};Password=${POSTGRES_PASSWORD:-nobat_dev_password}"
      Jwt__Secret: "${JWT_SECRET:-super-secret-dev-key-change-in-production-min-32-chars}"
      Jwt__Issuer: "${JWT_ISSUER:-nobat}"
      Jwt__Audience: "${JWT_AUDIENCE:-nobat}"
      Cors__AllowedOrigins: "http://localhost:3000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nobat-frontend
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:5000"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:

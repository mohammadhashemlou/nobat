# Production stack — immutable images, no source mounts, health-gated startup.
#   cp .env.example .env    # then set real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
name: nobat

services:
  postgres:
    image: postgres:17-alpine
    container_name: nobat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nobat-backend:latest
    container_name: nobat-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      Jwt__Issuer: ${JWT_ISSUER:-nobat}
      Jwt__Audience: ${JWT_AUDIENCE:-nobat}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env}
      BusinessTimezone: ${BUSINESS_TIMEZONE:-Asia/Tehran}
    ports:
      - "${API_PORT:-5000}:8080"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:?set PUBLIC_API_BASE in .env}
    image: nobat-frontend:latest
    container_name: nobat-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: always

volumes:
  postgres-data:
